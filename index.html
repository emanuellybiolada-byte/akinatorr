    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 25px 50px rgba(0,0,0,0.45);
    }
    .genie { font-size: 70px; margin-bottom: 8px; }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ffd700, #ff9a00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub { color: #aaa; font-size: 0.95rem; margin-bottom: 20px; }
    #question {
      font-size: 1.22rem;
      line-height: 1.4;
      min-height: 70px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    button {
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }
    button:hover { transform: scale(1.03); filter: brightness(1.1); }
    .yes { background: linear-gradient(90deg, #00b09b, #96c93d); }
    .no  { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
    .idk { background: linear-gradient(90deg, #4b6cb7, #182848); }
    .restart { background: linear-gradient(90deg, #8e2de2, #4a00e0); }
    .progress {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      width: 0%;
      transition: width 0.3s ease;
    }
    .contador {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 16px;
    }
    .result { display: none; }
    .result.show { display: block; }
    .hidden { display: none !important; }
    .guess { font-size: 1.9rem; font-weight: 700; color: #ffd700; margin: 12px 0 8px; }
    .desc { color: #bbb; margin-bottom: 16px; }
    #foto {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      margin: 10px auto 20px;
      border: 3px solid #ffd700;
      display: block;
      background: #222;
    }
  </style>

    const perguntas = [
      { texto: "Essa pessoa é real ou é um personagem de ficção?", chave: "real" },
      { texto: "É um homem?", chave: "homem" },
      { texto: "Essa pessoa ainda está viva?", chave: "vivo" },
      { texto: "É brasileiro(a)?", chave: "br" },
      { texto: "É esportista (jogador, atleta, piloto...)?", chave: "esporte" },
      { texto: "É cantor(a) ou faz música?", chave: "cantor" },
      { texto: "É político(a)?", chave: "politica" },
      { texto: "É youtuber, streamer ou influenciador digital?", chave: "youtuber" },
      { texto: "É ator/atriz ou apresentador(a)?", chave: "ator" },
      { texto: "Essa pessoa ficou famosa há mais de 25 anos?", chave: "antigo" },
      { texto: "É rapper?", chave: "rap" },
      { texto: "É cantor(a) de funk?", chave: "funk" },
    ];

    let scores = {};
    let usadas = [];
    let total = 0;
    let ultimaChave = null;
    const MINIMO = 10;
    const LIMITE_CONFIANCA = 25; // Só chuta se a diferença for grande

    function iniciar() {
      scores = {};
      pessoas.forEach(p => scores[p.nome] = 50); // Todo mundo começa com 50 pontos
      usadas = [];
      total = 0;
      ultimaChave = null;

      document.getElementById("startArea").classList.add("hidden");
      document.getElementById("answerArea").classList.remove("hidden");
      document.getElementById("result").classList.remove("show");
      document.getElementById("game").classList.remove("hidden");
      document.getElementById("contador").innerText = "Pergunta 0";
      document.getElementById("bar").style.width = "0%";
      document.getElementById("foto").style.display = "block";

      proxima();
    }

    function getTopCandidatos() {
      return Object.entries(scores)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .map(([nome]) => pessoas.find(p => p.nome === nome));
    }

    function proxima() {
      // Verifica se já pode chutar com confiança
      const ranking = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      if (total >= MINIMO && ranking.length >= 2) {
        const diff = ranking[0][1] - ranking[1][1];
        if (diff >= LIMITE_CONFIANCA) {
          mostrar();
          return;
        }
      }

      if (total >= 22) {
        mostrar();
        return;
      }

      // Escolhe a melhor pergunta baseado nos candidatos atuais
      const candidatos = getTopCandidatos();
      let melhor = null;
      let melhorScore = -1;

      for (let p of perguntas) {
        if (usadas.includes(p.chave)) continue;

        let sim = 0, nao = 0;
        for (let c of candidatos) {
          if (c[p.chave] === 1) sim++;
          else nao++;
        }

        // Prefere perguntas que dividem bem os candidatos restantes
        const score = Math.min(sim, nao) * 2 + (sim + nao);
        if (score > melhorScore) {
          melhorScore = score;
          melhor = p;
        }
      }

      if (melhor) {
        usadas.push(melhor.chave);
        ultimaChave = melhor.chave;
        document.getElementById("question").innerText = melhor.texto;
      } else {
        mostrar();
        return;
      }

      total++;
      document.getElementById("contador").innerText = `Pergunta ${total}`;
      document.getElementById("bar").style.width = Math.min((total / 18) * 100, 95) + "%";
    }

    function responder(valor) {
      if (ultimaChave && valor !== null) {
        // Pontuação inteligente
        const pesoBase = ultimaChave === "homem" ? 18 : 8;

        pessoas.forEach(p => {
          if (valor === true) {
            if (p[ultimaChave] === 1) {
              scores[p.nome] += pesoBase;
            } else {
              scores[p.nome] -= (pesoBase + 6);
            }
          } else {
            if (p[ultimaChave] === 0) {
              scores[p.nome] += pesoBase;
            } else {
              scores[p.nome] -= (pesoBase + 6);
            }
          }
        });
      }
      proxima();
    }

    function mostrar() {
      document.getElementById("game").classList.add("hidden");
      document.getElementById("result").classList.add("show");
      document.getElementById("bar").style.width = "100%";
      document.getElementById("contador").innerText = `Fez ${total} perguntas`;

      const ranking = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const melhorNome = ranking[0][0];
      const pessoa = pessoas.find(p => p.nome === melhorNome);

      if (pessoa) {
        document.getElementById("nome").innerText = pessoa.nome;
        document.getElementById("descricao").innerText = pessoa.desc;
        if (pessoa.img) {
          document.getElementById("foto").src = pessoa.img;
          document.getElementById("foto").style.display = "block";
        } else {
          document.getElementById("foto").style.display = "none";
        }
      } else {
        document.getElementById("nome").innerText = "Não consegui";
        document.getElementById("descricao").innerText = "Tente de novo";
        document.getElementById("foto").style.display = "none";
      }
    }

    function acertou() {
      document.getElementById("nome").innerText = "Acertei! 🎉";
      document.getElementById("descricao").innerText = "Boa!";
      setTimeout(reiniciar, 2000);
    }

    function errou() {
      document.getElementById("nome").innerText = "Errei 😅";
      document.getElementById("descricao").innerText = "Vou tentar melhorar";
      setTimeout(reiniciar, 2000);
    }

    function reiniciar() {
      document.getElementById("result").classList.remove("show");
      document.getElementById("game").classList.remove("hidden");
      document.getElementById("startArea").classList.remove("hidden");
      document.getElementById("answerArea").classList.add("hidden");
      document.getElementById("question").innerText = "Clique em Começar para eu tentar adivinhar";
      document.getElementById("bar").style.width = "0%";
      document.getElementById("contador").innerText = "Pergunta 0";
    }
  </script>
</body>
</html>
